name: Build Debug APK & Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.3) — leave blank to auto-generate'
        required: false
        default: ''
      release_notes:
        description: 'Release notes / changelog'
        required: false
        default: ''
# ── Explicit permissions required for GITHUB_TOKEN to create/update releases ──
# Without this block GitHub defaults to read-only scope → 403 on release create.
permissions:
  contents: write   # create tags, create/update releases, upload APK assets
  actions: write    # read workflow run metadata + delete failed runs

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so we can count commits for auto-tag

      # ── 2. Java 17 (matches app/build.gradle compileOptions) ──────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 2.1. Setup Gradle Wrapper ─────────────────────────────────────
      - name: Setup Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
        with:
          validate-wrapper-files: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      # ── 3. Gradle permission ───────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 4. Cache Gradle dependencies ──────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Build debug APK ─────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

      # ── 6. Rename APK with version + commit sha ────────────────────────
      - name: Rename APK
        id: rename_apk
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ORIGINAL="app/build/outputs/apk/debug/app-debug.apk"
          RENAMED="app/build/outputs/apk/debug/GoldenAudiobook-debug-${SHORT_SHA}.apk"
          mv "$ORIGINAL" "$RENAMED"
          echo "apk_path=$RENAMED" >> $GITHUB_OUTPUT
          echo "apk_name=GoldenAudiobook-debug-${SHORT_SHA}.apk" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      # ── 7. Upload APK as workflow artifact (available on every run) ────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldenAudiobook-debug-${{ steps.rename_apk.outputs.short_sha }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 30

      # ── 8. Determine release tag ───────────────────────────────────────
      #   • Manual dispatch: use the provided tag, or auto-generate one
      #   • Push to main/master: auto-generate from versionName + commit count
      #   • Pull request: skip release entirely
      - name: Determine release tag
        id: tag
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            # Read versionName from build.gradle
            VERSION=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d '[:space:]')
            # Count commits as build number
            BUILD=$(git rev-list --count HEAD)
            TAG="v${VERSION}-build${BUILD}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      # ── 9. Get last commit message ─────────────────────────────────────
      - name: Get last commit message
        id: commit_msg
        if: github.event_name != 'pull_request'
        run: |
          MSG=$(git log -1 --pretty=%B | tr -d '\r')
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ── 10. Create or update GitHub Release ───────────────────────────
      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "GoldenAudiobook ${{ steps.tag.outputs.tag }}"
          body: |
            ## GoldenAudiobook — Debug Build

            **Tag:** `${{ steps.tag.outputs.tag }}`
            **Commit:** [`${{ steps.rename_apk.outputs.short_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Branch:** `${{ github.ref_name }}`
            **Built:** ${{ github.run_id }}

            ---

            ${{ github.event.inputs.release_notes || steps.commit_msg.outputs.message }}

            ---

            ### Install
            1. Download `GoldenAudiobook-debug-*.apk` below
            2. Enable **Install unknown apps** on your Android device
            3. Sideload via ADB:
               ```bash
               adb connect <device-ip>:5555
               adb install GoldenAudiobook-debug-*.apk
               ```
          files: ${{ steps.rename_apk.outputs.apk_path }}
          # If tag already exists → update the release (draft: false keeps it public)
          draft: false
          prerelease: true        # debug builds are pre-releases by convention
          make_latest: false      # don't override a signed release as "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── Cleanup: delete all failed workflow runs ─────────────────────────────
  cleanup_failed_runs:
    name: Delete Failed Workflow Runs
    runs-on: ubuntu-latest
    # Always runs after build, regardless of whether build passed or failed.
    # This ensures even the run that just failed gets cleaned up on next push.
    needs: build
    if: always()

    steps:
      - name: Check for failed runs
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;


            // Collect all failed runs across all pages
            let failedRuns = [];
            let page = 1;


            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                status: 'failure',
                per_page: 100,
                page,
              });

              if (data.workflow_runs.length === 0) break;
              failedRuns = failedRuns.concat(data.workflow_runs);
              page++;
            }


            console.log(`Found ${failedRuns.length} failed run(s).`);
            core.setOutput('count', failedRuns.length);


            // Store IDs as JSON for the next step
            core.setOutput('run_ids', JSON.stringify(failedRuns.map(r => r.id)));


      - name: Delete failed runs
        if: steps.check.outputs.count > 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner   = context.repo.owner;
            const repo    = context.repo.repo;
            const runIds  = JSON.parse('${{ steps.check.outputs.run_ids }}');
            const current = context.runId;   // never delete the currently running job

            let deleted = 0;
            let skipped = 0;


            for (const id of runIds) {
              if (id === current) {
                console.log(`Skipping current run #${id}`);
                skipped++;
                continue;
              }
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: id });
                console.log(`✅ Deleted failed run #${id}`);
                deleted++;
              } catch (err) {
                console.warn(`⚠️  Could not delete run #${id}: ${err.message}`);
              }
            }


            console.log(`\nSummary: ${deleted} deleted, ${skipped} skipped (current run).`);
